<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR: Dopamine Detox</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #welcome, #menu, #session, #result {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 {
    font-size: 3em;
    color: lime;
    text-shadow: 0 0 10px lime;
  }
  button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 1.2em;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: lime;
    color: #000;
  }
  #noiseBarContainer {
    width: 80%;
    height: 20px;
    background-color: #444;
    border-radius: 10px;
    margin: 20px 0;
  }
  #noiseBar {
    height: 100%;
    background-color: lime;
    width: 100%;
    border-radius: 10px;
    text-align: right;
    padding-right: 5px;
    box-sizing: border-box;
    color: #000;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="welcome">
  <h1>ERROR: System przeciążony</h1>
  <p>Wpisz swój nickname i dołącz:</p>
  <input type="text" id="nickname" placeholder="Twój nick">
  <button id="joinBtn">Dołącz</button>
</div>

<div id="menu">
  <h2>Witaj <span id="userName"></span>!</h2>
  <p>Wybierz sesję ciszy:</p>
  <button class="sessionBtn" data-time="60">60 sekund</button>
  <button class="sessionBtn" data-time="120">2 minuty</button>
  <button class="sessionBtn" data-time="300">5 minut</button>
  <button id="endSession">Zakończ sesję</button>
  <div id="noiseBarContainer">
    <div id="noiseBar">100%</div>
  </div>
  <p>Pasek szumu</p>
  <p>Zdobyte punkty: <span id="points">0</span></p>
</div>

<div id="session">
  <h2 id="timerDisplay"></h2>
  <p>Nie ruszaj myszką ani telefonem!</p>
</div>

<div id="result">
  <h2 id="resultMessage"></h2>
  <button id="backToMenu">Powrót do menu</button>
</div>

<script>
let points = 0;
let noise = 100;
let nickname = '';
let sessionTimer;
let sessionTime;
let mouseMoved = false;
let completedSessions = 0;

const welcome = document.getElementById('welcome');
const menu = document.getElementById('menu');
const session = document.getElementById('session');
const result = document.getElementById('result');

const joinBtn = document.getElementById('joinBtn');
const nicknameInput = document.getElementById('nickname');
const userNameDisplay = document.getElementById('userName');
const pointsDisplay = document.getElementById('points');
const timerDisplay = document.getElementById('timerDisplay');
const resultMessage = document.getElementById('resultMessage');
const backToMenu = document.getElementById('backToMenu');
const noiseBar = document.getElementById('noiseBar');

const sessionButtons = document.querySelectorAll('.sessionBtn');
const endSessionBtn = document.getElementById('endSession');

function show(element) {
  welcome.style.display = 'none';
  menu.style.display = 'none';
  session.style.display = 'none';
  result.style.display = 'none';
  element.style.display = 'flex';
}

function updateNoiseBar() {
  noiseBar.style.width = noise + '%';
  noiseBar.textContent = Math.floor(noise) + '%';
}

function startSession(time) {
  sessionTime = time;
  mouseMoved = false;
  show(session);
  timerDisplay.textContent = sessionTime + 's';
  
  // Funkcja sprawdzająca ruch dopiero po rozpoczęciu odliczania
  function onMove() {
    if (!mouseMoved) {
      mouseMoved = true;
      clearInterval(sessionTimer);
      endSession('error');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('touchstart', onMove);
    }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchstart', onMove);

  sessionTimer = setInterval(() => {
    sessionTime--;
    timerDisplay.textContent = sessionTime + 's';
    noise -= 100 / (time); // zmniejszanie szumu
    if (noise < 0) noise = 0;
    updateNoiseBar();
    if (sessionTime <= 0) {
      clearInterval(sessionTimer);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('touchstart', onMove);
      if (!mouseMoved) {
        completedSessions++;
        endSession('success');
      }
    }
  }, 1000);
}

function endSession(status) {
  show(result);
  if (status === 'success') {
    points += 2;
    resultMessage.textContent = `Gratulacje, odzyskałeś ${completedSessions}% siebie!`;
  } else {
    resultMessage.textContent = 'ERROR: Nie udało Ci się wykonać zadania. Spróbuj ponownie.';
  }
  pointsDisplay.textContent = points;
}

joinBtn.addEventListener('click', () => {
  nickname = nicknameInput.value || 'Anon';
  userNameDisplay.textContent = nickname;
  show(menu);
});

sessionButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    startSession(parseInt(btn.dataset.time));
  });
});

backToMenu.addEventListener('click', () => {
  show(menu);
});

endSessionBtn.addEventListener('click', () => {
  show(result);
  resultMessage.textContent = `Sesja zakończona. Twoje punkty: ${points}`;
});
updateNoiseBar();
show(welcome);
</script>

</body>
</html>

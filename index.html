<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR: Dopamine Detox</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background-color: #000;
    color: #00ff00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  h1 {
    font-size: 4rem;
    margin: 20px 0;
    text-shadow: 0 0 10px #00ff00;
  }
  #nicknameScreen, #introScreen, #menuScreen, #sessionScreen, #endScreen {
    display: none;
    flex-direction: column;
    align-items: center;
  }
  button {
    margin: 10px;
    padding: 15px 30px;
    font-size: 1.5rem;
    cursor: pointer;
    background-color: #000;
    border: 2px solid #00ff00;
    color: #00ff00;
    text-transform: uppercase;
  }
  #noiseBarContainer {
    width: 80%;
    background: #222;
    border: 1px solid #00ff00;
    margin: 20px 0;
    height: 30px;
  }
  #noiseBar {
    height: 100%;
    background: #00ff00;
    width: 100%;
    transition: width 0.5s;
  }
  #timer {
    font-size: 5rem;
    margin: 20px 0;
  }
  #message {
    font-size: 1.8rem;
    margin: 20px 0;
  }
  @media (max-width: 600px) {
    h1 { font-size: 3rem; }
    button { font-size: 1.2rem; padding: 10px 20px; }
    #timer { font-size: 4rem; }
  }
</style>
</head>
<body>

<div id="nicknameScreen">
  <h1>ERROR</h1>
  <p>Przeciążenie systemu. Chcesz do nas dołączyć? Wpisz swój nickname:</p>
  <input type="text" id="nicknameInput" placeholder="Twój nickname">
  <button id="joinBtn">Dołącz</button>
</div>

<div id="introScreen">
  <p id="introMessage"></p>
  <div id="noiseBarContainer">
    <div id="noiseBar"></div>
  </div>
</div>

<div id="menuScreen">
  <h1>MENU</h1>
  <button id="startSessionBtn">60 sekund ciszy</button>
  <button id="endSessionBtn">Zakończ sesję</button>
  <p>Twoje punkty: <span id="pointsDisplay">0</span></p>
  <div id="noiseBarContainer">
    <div id="noiseBar"></div>
  </div>
</div>

<div id="sessionScreen">
  <h1>Trzymaj się 60 sekund</h1>
  <div id="timer">60</div>
  <p id="message"></p>
</div>

<div id="endScreen">
  <h1 id="endTitle"></h1>
  <p id="endMessage"></p>
  <button id="backToMenuBtn">Powrót do menu</button>
</div>

<script>
let nickname = '';
let points = 0;
let noiseLevel = 100;
let sessionTime = 60;
let timerInterval;
let mouseMoved = false;

// Elementy
const nicknameScreen = document.getElementById('nicknameScreen');
const introScreen = document.getElementById('introScreen');
const menuScreen = document.getElementById('menuScreen');
const sessionScreen = document.getElementById('sessionScreen');
const endScreen = document.getElementById('endScreen');
const introMessage = document.getElementById('introMessage');
const noiseBar = document.getElementById('noiseBar');
const timerDisplay = document.getElementById('timer');
const messageDisplay = document.getElementById('message');
const pointsDisplay = document.getElementById('pointsDisplay');
const endTitle = document.getElementById('endTitle');
const endMessage = document.getElementById('endMessage');

document.getElementById('joinBtn').addEventListener('click', () => {
  const val = document.getElementById('nicknameInput').value.trim();
  if(val) {
    nickname = val;
    nicknameScreen.style.display = 'none';
    showIntro();
  }
});

function showIntro() {
  introScreen.style.display = 'flex';
  introMessage.textContent = `Witaj ${nickname}, ile dziś odzyskałeś ciszy?`;
  noiseLevel = 100;
  updateNoiseBar();
  setTimeout(() => {
    introScreen.style.display = 'none';
    showMenu();
  }, 5000);
}

function showMenu() {
  menuScreen.style.display = 'flex';
  pointsDisplay.textContent = points;
  updateNoiseBar();
}

document.getElementById('startSessionBtn').addEventListener('click', startSession);
document.getElementById('endSessionBtn').addEventListener('click', endSession);
document.getElementById('backToMenuBtn').addEventListener('click', () => {
  endScreen.style.display = 'none';
  showMenu();
});

function updateNoiseBar() {
  noiseBar.style.width = noiseLevel + '%';
  noiseBar.textContent = noiseLevel + '%';
}

function startSession() {
  menuScreen.style.display = 'none';
  sessionScreen.style.display = 'flex';
  timerDisplay.textContent = sessionTime;
  messageDisplay.textContent = '';
  mouseMoved = false;

  document.addEventListener('mousemove', detectMouseMove);
  document.addEventListener('touchstart', detectMouseMove);

  let timeLeft = sessionTime;
  timerInterval = setInterval(() => {
    if(mouseMoved) {
      clearInterval(timerInterval);
      sessionScreen.style.display = 'none';
      showEndScreen(false);
      document.removeEventListener('mousemove', detectMouseMove);
      document.removeEventListener('touchstart', detectMouseMove);
      return;
    }
    timeLeft--;
    timerDisplay.textContent = timeLeft;
    noiseLevel = Math.max(0, noiseLevel - (100/sessionTime));
    updateNoiseBar();
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      sessionScreen.style.display = 'none';
      points += 2;
      showEndScreen(true);
      document.removeEventListener('mousemove', detectMouseMove);
      document.removeEventListener('touchstart', detectMouseMove);
    }
  }, 1000);
}

function detectMouseMove() {
  mouseMoved = true;
}

function showEndScreen(success) {
  endScreen.style.display = 'flex';
  if(success) {
    endTitle.textContent = 'Gratulacje!';
    endMessage.textContent = 'Odzyskałeś 1% siebie.';
  } else {
    endTitle.textContent = 'ERROR';
    endMessage.textContent = 'Nie udało Ci się wykonać zadania. Spróbuj ponownie.';
  }
  pointsDisplay.textContent = points;
}

function endSession() {
  sessionScreen.style.display = 'none';
  pointsDisplay.textContent = points;
  endScreen.style.display = 'flex';
  endTitle.textContent = 'Sesja zakończona';
  endMessage.textContent = `Twoje punkty: ${points}`;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR: Dopamine Detox</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box; font-family:'Arial',sans-serif;}
  body {background:#000; color:#0f0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center;}
  h1 {font-size:4em; margin-bottom:0.5em; text-shadow:0 0 10px #0f0,0 0 20px #0f0;}
  button {background:#0f0; color:#000; border:none; padding:1em 2em; margin:0.5em; font-size:1.2em; cursor:pointer; transition:0.3s;}
  button:hover {opacity:0.8;}
  input {padding:0.5em 1em; font-size:1em; margin-top:1em; border:none; border-radius:5px;}
  #menu,#session,#result {display:none; flex-direction:column; align-items:center;}
  #noiseBarContainer {width:80%; height:30px; background:#222; margin:1em 0; border-radius:5px; overflow:hidden;}
  #noiseBar {height:100%; background:#0f0; width:100%; transition:width 1s linear;}
  .errorText {color:#0f0; font-size:3em; text-shadow:0 0 20px #0f0,0 0 40px #0f0; animation:glitch 0.3s infinite;}
  @keyframes glitch {
    0%{text-shadow:2px 0 #0f0, -2px 0 #0f0;}
    20%{text-shadow:-2px 2px #0f0, 2px -2px #0f0;}
    40%{text-shadow:2px -2px #0f0, -2px 2px #0f0;}
    60%{text-shadow:-2px 0 #0f0, 2px 0 #0f0;}
    80%{text-shadow:2px 2px #0f0, -2px -2px #0f0;}
    100%{text-shadow:0 2px #0f0, 0 -2px #0f0;}
  }
  @media(max-width:600px){h1{font-size:3em;} button{padding:0.8em 1.5em; font-size:1em;}}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start">
  <h1>ERROR</h1>
  <input type="text" id="nickname" placeholder="Twój nick">
  <button id="joinBtn">Dołącz</button>
</div>

<!-- MAIN MENU -->
<div id="menu">
  <div id="noiseBarContainer">
    <div id="noiseBar"></div>
  </div>
  <p>Punkty: <span id="points">0</span></p>
  <h2>Wybierz czas sesji:</h2>
  <button class="sessionTimeBtn" data-time="60">60 sekund</button>
  <button class="sessionTimeBtn" data-time="120">2 minuty</button>
  <button class="sessionTimeBtn" data-time="300">5 minut</button>
</div>

<!-- SESSION SCREEN -->
<div id="session">
  <h2 id="timerDisplay"></h2>
  <p>Nie ruszaj myszką ani ekranem!</p>
</div>

<!-- RESULT SCREEN -->
<div id="result">
  <h2 id="resultText"></h2>
  <p id="noiseText"></p>
  <button id="backMenuBtn">Powrót do menu</button>
  <button id="nextSessionBtn">Nowa sesja</button>
</div>

<script>
let points = 0;
let noise = 100;
let timerInterval;
let sessionActive = false;
let sessionTime = 60;

// ELEMENTY
const startScreen = document.getElementById('start');
const menuScreen = document.getElementById('menu');
const sessionScreen = document.getElementById('session');
const resultScreen = document.getElementById('result');

const joinBtn = document.getElementById('joinBtn');
const sessionTimeBtns = document.querySelectorAll('.sessionTimeBtn');
const nextSessionBtn = document.getElementById('nextSessionBtn');
const backMenuBtn = document.getElementById('backMenuBtn');

const nicknameInput = document.getElementById('nickname');
const pointsDisplay = document.getElementById('points');
const timerDisplay = document.getElementById('timerDisplay');
const resultText = document.getElementById('resultText');
const noiseText = document.getElementById('noiseText');

const noiseBar = document.getElementById('noiseBar');

function showScreen(screen){
  startScreen.style.display='none';
  menuScreen.style.display='none';
  sessionScreen.style.display='none';
  resultScreen.style.display='none';
  screen.style.display='flex';
}

function startTimer(){
  let timeLeft = sessionTime;
  timerDisplay.textContent = formatTime(timeLeft);
  sessionActive = true;
  let startTime = Date.now();
  timerInterval = setInterval(()=>{
    let elapsed = Math.floor((Date.now()-startTime)/1000);
    let remaining = sessionTime - elapsed;
    if(remaining>=0){
      timerDisplay.textContent = formatTime(remaining);
    } else {
      endSession(true);
    }
  },1000);
}

function formatTime(sec){
  let minutes = Math.floor(sec/60);
  let seconds = sec%60;
  return minutes>0 ? `${minutes}:${seconds.toString().padStart(2,'0')}` : `${seconds}s`;
}

function endSession(success){
  clearInterval(timerInterval);
  sessionActive = false;
  if(success){
    points += 2;
    noise = Math.max(0, noise-5);
    resultText.textContent = 'Gratulacje! Odzyskałeś 1% siebie';
  } else {
    resultText.innerHTML = '<span class="errorText">ERROR: Nie udało Ci się wykonać zadania. Spróbuj ponownie.</span>';
  }
  noiseText.textContent = `Pasek szumu: ${noise}%`;
  pointsDisplay.textContent = points;
  updateNoiseBar();
  showScreen(resultScreen);
}

function updateNoiseBar(){
  noiseBar.style.width = `${noise}%`;
}

// EVENTY
joinBtn.addEventListener('click', ()=>{
  if(nicknameInput.value.trim()!==''){
    showScreen(menuScreen);
  }
});

sessionTimeBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    sessionTime = parseInt(btn.dataset.time);
    showScreen(sessionScreen);
    startTimer();
  });
});

backMenuBtn.addEventListener('click', ()=>{ showScreen(menuScreen); });
nextSessionBtn.addEventListener('click', ()=>{ showScreen(menuScreen); });

document.addEventListener('mousemove', e=>{
  if(sessionActive){ endSession(false); }
});
document.addEventListener('touchstart', e=>{
  if(sessionActive){ endSession(false); }
});

setInterval(updateNoiseBar, 500);

</script>
</body>
</html>

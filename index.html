<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR: Dopamine Detox</title>
<style>
  body {
    background: #000;
    color: #0f0;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  .hidden { display: none; }
  button {
    background: #111;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
    font-family: monospace;
    font-size: 1rem;
  }
  #noiseBar {
    width: 200px;
    height: 20px;
    border: 1px solid #0f0;
    margin-top: 20px;
    position: relative;
  }
  #noiseLevel {
    height: 100%;
    background: #0f0;
    width: 100%;
  }
</style>
</head>
<body>

<div id="nicknameScreen">
  <h2>Wpisz swój nickname</h2>
  <input type="text" id="nicknameInput" placeholder="Twój nickname">
  <button id="joinBtn">Dołącz</button>
</div>

<div id="welcomeScreen" class="hidden">
  <h2>Witaj, <span id="userNameDisplay"></span>!</h2>
  <p>Odzyskałeś dotychczas <span id="userPointsDisplay">0</span> punktów ciszy.</p>
</div>

<div id="mainMenu" class="hidden">
  <h2>System przeciążony. Sprawdź poziom szumu.</h2>
  <div id="noiseBar">
    <div id="noiseLevel"></div>
  </div>
  <button id="start60Btn">Rozpocznij 60 sekund ciszy</button>
  <button id="endSessionBtn">Zakończ sesję</button>
</div>

<div id="sessionScreen" class="hidden">
  <h2>Zostań tu <span id="timer">60</span> sekund i nic nie rób</h2>
  <div id="noiseBar">
    <div id="noiseLevel"></div>
  </div>
</div>

<div id="resultScreen" class="hidden">
  <h2>Gratulacje! Odzyskałeś <span id="percentGained">1%</span> siebie.</h2>
  <p>Twoje punkty ciszy: <span id="totalPoints">0</span></p>
  <button id="againBtn">Kolejne 60 sekund</button>
  <button id="backMenuBtn">Wróć do menu</button>
</div>

<script>
let nickname = "";
let points = 0;
let noiseLevel = 100; // procentowy wskaźnik szumu

const nicknameScreen = document.getElementById('nicknameScreen');
const welcomeScreen = document.getElementById('welcomeScreen');
const mainMenu = document.getElementById('mainMenu');
const sessionScreen = document.getElementById('sessionScreen');
const resultScreen = document.getElementById('resultScreen');

const nicknameInput = document.getElementById('nicknameInput');
const joinBtn = document.getElementById('joinBtn');
const userNameDisplay = document.getElementById('userNameDisplay');
const userPointsDisplay = document.getElementById('userPointsDisplay');

const start60Btn = document.getElementById('start60Btn');
const endSessionBtn = document.getElementById('endSessionBtn');

const timerDisplay = document.getElementById('timer');
const noiseDiv = document.getElementById('noiseLevel');

const percentGained = document.getElementById('percentGained');
const totalPointsDisplay = document.getElementById('totalPoints');
const againBtn = document.getElementById('againBtn');
const backMenuBtn = document.getElementById('backMenuBtn');

// dołączanie nickname
joinBtn.addEventListener('click', () => {
  nickname = nicknameInput.value || "Anon";
  nicknameScreen.classList.add('hidden');
  welcomeScreen.classList.remove('hidden');
  userNameDisplay.textContent = nickname;
  userPointsDisplay.textContent = points;
  
  setTimeout(() => {
    welcomeScreen.classList.add('hidden');
    mainMenu.classList.remove('hidden');
    updateNoiseBar();
  }, 10000); // 10 sekund powitania
});

// start 60 sekund
start60Btn.addEventListener('click', () => {
  mainMenu.classList.add('hidden');
  sessionScreen.classList.remove('hidden');
  let timeLeft = 60;
  
  const timerInterval = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = timeLeft;
    // zmniejszanie szumu
    noiseLevel = Math.max(0, noiseLevel - 0.8);
    updateNoiseBar();

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      sessionScreen.classList.add('hidden');
      points += 2; // 2 punkty za 60 sekund
      percentGained.textContent = "1%";
      totalPointsDisplay.textContent = points;
      resultScreen.classList.remove('hidden');
    }
  }, 1000);
});

// przycisk kolejne 60 sekund
againBtn.addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  mainMenu.classList.remove('hidden');
});

// powrót do menu
backMenuBtn.addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  mainMenu.classList.remove('hidden');
});

// zakończ sesję
endSessionBtn.addEventListener('click', () => {
  alert("Sesja zakończona. Twoje punkty: " + points);
});

// aktualizacja paska szumu
function updateNoiseBar() {
  noiseDiv.style.width = noiseLevel + "%";
}
</script>

</body>
</html>

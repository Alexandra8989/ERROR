<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR: Dopamine Detox</title>
<style>
  /* RESET & BODY */
  * {margin:0; padding:0; box-sizing:border-box; font-family: 'Arial', sans-serif;}
  body {background:#000; color:#0f0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; overflow-x:hidden;}
  h1 {font-size:4em; margin-bottom:0.5em; text-shadow:0 0 10px #0f0, 0 0 20px #0f0;}
  button {background:#0f0; color:#000; border:none; padding:1em 2em; margin:1em; font-size:1.2em; cursor:pointer; transition:0.3s;}
  button:hover {opacity:0.8;}
  #menu, #session, #result {display:none; flex-direction:column; align-items:center;}
  #noiseBarContainer {width:80%; height:30px; background:#222; margin:1em 0; border-radius:5px; overflow:hidden;}
  #noiseBar {height:100%; background:#0f0; width:100%; transition:width 1s linear;}
  input {padding:0.5em 1em; font-size:1em; margin-top:1em; border:none; border-radius:5px;}
  @media(max-width:600px){h1{font-size:3em;} button{padding:0.8em 1.5em; font-size:1em;}}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start">
  <h1>ERROR</h1>
  <p>Ile dziś odzyskałeś ciszy?</p>
  <input type="text" id="nickname" placeholder="Twój nick">
  <button id="joinBtn">Dołącz</button>
</div>

<!-- MAIN MENU -->
<div id="menu">
  <div id="noiseBarContainer">
    <div id="noiseBar"></div>
  </div>
  <p>Punkty: <span id="points">0</span></p>
  <button id="startSessionBtn">Rozpocznij 60 sekund ciszy</button>
</div>

<!-- SESSION SCREEN -->
<div id="session">
  <h2 id="timerDisplay">60</h2>
  <p>Nie ruszaj myszką ani ekranem!</p>
</div>

<!-- RESULT SCREEN -->
<div id="result">
  <h2 id="resultText"></h2>
  <p id="percentText"></p>
  <button id="nextSessionBtn">Kolejne 60 sekund</button>
  <button id="backMenuBtn">Powrót do menu</button>
</div>

<script>
let points = 0;
let noise = 100;
let timer = 60;
let timerInterval;
let sessionActive = false;

// ELEMENTS
const startScreen = document.getElementById('start');
const menuScreen = document.getElementById('menu');
const sessionScreen = document.getElementById('session');
const resultScreen = document.getElementById('result');

const joinBtn = document.getElementById('joinBtn');
const startSessionBtn = document.getElementById('startSessionBtn');
const nextSessionBtn = document.getElementById('nextSessionBtn');
const backMenuBtn = document.getElementById('backMenuBtn');

const nicknameInput = document.getElementById('nickname');
const pointsDisplay = document.getElementById('points');
const timerDisplay = document.getElementById('timerDisplay');
const resultText = document.getElementById('resultText');
const percentText = document.getElementById('percentText');

const noiseBar = document.getElementById('noiseBar');

// FUNKCJE
function showScreen(screen){
  startScreen.style.display = 'none';
  menuScreen.style.display = 'none';
  sessionScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  screen.style.display = 'flex';
}

function startTimer(){
  timer = 60;
  timerDisplay.textContent = timer;
  sessionActive = true;
  let startTime = Date.now();
  timerInterval = setInterval(() => {
    let elapsed = Math.floor((Date.now() - startTime)/1000);
    let remaining = 60 - elapsed;
    if(remaining >= 0){
      timerDisplay.textContent = remaining;
    } else {
      endSession(true);
    }
  }, 1000);
}

function endSession(success){
  clearInterval(timerInterval);
  sessionActive = false;
  if(success){
    points += 2;
    noise = Math.max(0, noise - 5);
    resultText.textContent = 'Gratulacje! Odzyskałeś 1% siebie';
  } else {
    resultText.textContent = 'ERROR: Nie udało Ci się wykonać zadania. Spróbuj ponownie.';
  }
  percentText.textContent = `Pasek szumu: ${noise}%`;
  pointsDisplay.textContent = points;
  showScreen(resultScreen);
  updateNoiseBar();
}

function updateNoiseBar(){
  noiseBar.style.width = `${noise}%`;
}

// EVENTY
joinBtn.addEventListener('click', () => {
  if(nicknameInput.value.trim() !== ''){
    showScreen(menuScreen);
    setTimeout(()=>alert(`Witaj ${nicknameInput.value}! Ile dzisiaj odzyskasz ciszy?`), 500);
  }
});

startSessionBtn.addEventListener('click', () => {
  showScreen(sessionScreen);
  startTimer();
});

nextSessionBtn.addEventListener('click', () => {
  showScreen(sessionScreen);
  startTimer();
});

backMenuBtn.addEventListener('click', () => {
  showScreen(menuScreen);
});

// Zatrzymanie przy ruchu myszką lub dotyku
document.addEventListener('mousemove', e => {
  if(sessionActive){
    endSession(false);
  }
});
document.addEventListener('touchstart', e => {
  if(sessionActive){
    endSession(false);
  }
});

// Aktualizacja paska szumu w menu
setInterval(updateNoiseBar, 500);

</script>
</body>
</html>
